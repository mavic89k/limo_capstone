amcl:
  ros__parameters:
    use_sim_time: False             # [중요] 실제 로봇 시간 사용
    alpha1: 0.2                     # 오도메트리 회전 노이즈
    alpha2: 0.2                     # 오도메트리 병진(직진) 시 회전 노이즈
    alpha3: 0.2                     # 오도메트리 병진 노이즈
    alpha4: 0.2                     # 오도메트리 회전 시 병진 노이즈
    alpha5: 0.2                     # (특정 모션 모델용 노이즈)
    base_frame_id: "base_footprint" # 기준이 되는 로봇 바닥 프레임
    beam_skip_distance: 0.5         # 빔 스킵(무시) 기준 거리
    beam_skip_error_threshold: 0.9  # 무시할 빔의 에러 한계치
    beam_skip_threshold: 0.3        # 전체 빔 중 무시할 빔의 비율
    do_beamskip: false              # 빔 스킵 사용 안 함
    global_frame_id: "map"          # 최상위 글로벌 좌표계 (지도)
    lambda_short: 0.1               # 짧은 거리 측정 시 지수 감소율
    laser_likelihood_max_dist: 2.0  # 우도 필드(Likelihood field)의 최대 거리
    laser_max_range: 100.0          # 센서 스캔 데이터의 최대 유효 반경
    laser_min_range: -1.0           # 센서 최소 반경 (음수면 제한 없음)
    laser_model_type: "likelihood_field" # 라이다 모델 알고리즘 방식
    max_beams: 60                   # 파티클 업데이트 시 갱신할 최대 레이저 빔 개수
    max_particles: 2000             # 추정용 파티클 최대 개수
    min_particles: 500              # 추정용 파티클 최소 개수
    odom_frame_id: "odom"           # 오도메트리 기준 프레임
    pf_err: 0.05                    # 파티클 필터 에러 한계
    pf_z: 0.99                      # 파티클 필터 정규화 분포 상수
    recovery_alpha_fast: 0.0        # 빠른 회복 파라미터 (위치를 잃었을 때 새로 흩뿌림)
    recovery_alpha_slow: 0.0        # 느린 회복 파라미터
    resample_interval: 1            # 파티클을 재샘플링하는 주기
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # 차동 구동(두 바퀴) 모델
    save_pose_rate: 0.5             # 마지막 추정 위치를 저장하는 빈도
    sigma_hit: 0.2                  # 정확한 레이저 측정의 표준 편차
    tf_broadcast: true              # AMCL이 계산한 map->odom TF 방송 여부
    transform_tolerance: 1.0        # [중요] TF 지연 허용 오차 (CPU 과부하 에러 방지용으로 넉넉하게 1.0초 설정)
    update_min_a: 0.2               # 최소한 0.2 라디안 회전해야 파티클 갱신
    update_min_d: 0.25              # 최소한 0.25m 직진해야 파티클 갱신
    z_hit: 0.5                      # 측정값이 완벽하게 맞을 확률 가중치
    z_max: 0.05                     # 최대 거리 측정(오류) 가중치
    z_rand: 0.5                     # 측정 실패(노이즈) 가중치
    z_short: 0.05                   # 센서 앞 장애물로 인한 짧은 측정 가중치
    scan_topic: scan                # 받아올 레이저 토픽 이름

