bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0             # 1초에 20번 모터 제어 명령 계산
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # --- 진행 상태 점검 플러그인 ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0        # 10초 내에 0.5m 이상 안 움직이면 스턱(Stuck) 처리
    
    # --- 목적지 도착 판정 플러그인 ---
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25              # 목표 위치에서 25cm 이내면 도착으로 인정
      yaw_goal_tolerance: 0.25             # 목표 방향에서 0.25라디안 이내면 도착으로 인정
    
    # --- DWB (로컬 경로 제어기) ---
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26                      # 직진 최고 속도 (26cm/s)
      max_vel_y: 0.0                       # 좌우 이동 (LIMO는 불가)
      max_vel_theta: 1.0                   # 회전 최고 속도
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5                       # 직진 최대 가속도
      acc_lim_y: 0.0
      acc_lim_theta: 3.2                   # 회전 최대 가속도
      decel_lim_x: -2.5                    # 급브레이크 강도
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20                       # 시뮬레이션 직진 속도 후보 수
      vy_samples: 5
      vtheta_samples: 20                   # 시뮬레이션 회전 속도 후보 수
      sim_time: 1.7                        # 향후 1.7초를 내다보고 경로 예측
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2             # TF 지연 허용치
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      # 경로 채점 비평가 항목들 (높을수록 엄격히 따름)
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02             # 장애물을 피하는 데 들이는 비용
      PathAlign.scale: 32.0                # 계산된 경로를 그대로 따라가려는 성향
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0                # 목표 방향을 맞추려는 성향
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0                 # 글로벌 경로에서 벗어나지 않으려는 성향
      GoalDist.scale: 24.0                 # 목표에 가까워지려는 성향
      RotateToGoal.scale: 32.0             # 최종 목적지에서 회전하려는 성향
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:                             # 장애물 회피용 지역 코스트맵 (로봇 주변만 연산)
  local_costmap:
    ros__parameters:
      update_frequency: 5.0                # 지역 맵을 1초에 5번 갱신
      publish_frequency: 2.0
      global_frame: odom                   # 지역 맵 기준점은 오도메트리
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true                 # 로봇이 이동하면 맵도 함께 따라감
      width: 3                             # 지역 맵 너비 3m
      height: 3                            # 지역 맵 높이 3m
      resolution: 0.05
      robot_radius: 0.19                   # LIMO 차체 반경 (19cm)
      plugins: ["voxel_layer", "inflation_layer"]
      
      # 1) 인플레이션 레이어 (벽 안전 마진) ★커스텀 적용부★
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0           # 3.0 -> 7.0 (벽에서 조금 떨어져도 장애물 코스트가 가파르게 낮아짐)
        inflation_radius: 0.30             # 0.55 -> 0.30 (LIMO에 맞춘 좁은 반경 - 작은 방에서 끼임 문제 해결)
      
      # 2) 복셀 레이어 (3D 개념의 레이저 스캔)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True                   # 지나간 빈 공간은 장애물 삭제
          marking: True                    # 닿은 점은 장애물 마킹
          data_type: "LaserScan"
          raytrace_max_range: 3.0          # 장애물 삭제 탐색 반경
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5          # 이 반경 안쪽만 실제 장애물로 인지
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:                            # 경로 탐색용 전역 코스트맵 (전체 지도)
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                # 1초마다 맵 전체 갱신
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.19
      resolution: 0.05
      track_unknown_space: true            # 미개척지(Unknown) 표시
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      # 전역 지도 안전 마진 레이어 (지역 지도와 동일하게 커스텀 적용)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0           # (local과 맞춤)
        inflation_radius: 0.30             # (local과 맞춤)
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""                      # 런치 파일에서 주입하므로 비워둠

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:                            # 전역 경로 플래너 (출발지부터 도착지까지의 선)
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5                       # 정확히 도착하지 못하면 0.5m 반경 내를 목적지로 타협
      use_astar: false                     # 다익스트라(Dijkstra) 알고리즘 사용 (false 시)
      allow_unknown: true                  # 회색(Unknown) 영역을 지나가는 경로도 계획 허용

smoother_server:                           # 경로 곡선 다듬기 노드
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:                           # 로봇이 끼었을 때의 회복(Recovery) 행동 강령
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"        # 좁은 곳에서 빙글빙글 돌며 탈출구 찾기
    backup:
      plugin: "nav2_behaviors/BackUp"      # 뒤로 후진해서 탈출
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0                # 회복 동작 시 뱅글 도는 최고 속도
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:                         # 다중 목적지 순찰 매니저
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200         # 목적지에 도착한 뒤 머무는 시간

velocity_smoother:                         # 속도 곡선 다듬기
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]         # 부드러운 가감속을 위한 최고/최저 한계치
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0