explore_node:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.33      # 3초마다 새로운 프론티어 탐색
    progress_timeout: 20.0       # 20초간 진전이 없으면 다음 프론티어로 전환
    potential_scale: 3.0         # 거리 비용 가중치
    orientation_scale: 0.0
    gain_scale: 1.0              # 미탐색 영역 크기 가중치
    transform_tolerance: 0.3
    min_frontier_size: 0.35      # LIMO 통과 가능한 최소 개척 크기 (m)
